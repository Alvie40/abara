version: "3.8"

services:
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=abara
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bookstore
      DB_USE_SSL: "false"
      SECRET_KEY: your-super-secret-key-here
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: >
      bash -c "ollama serve & sleep 2 && ollama pull codellama:13b-instruct && tail -f /dev/null"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@db:5432/abara
      - MCP_URL=http://mcp:8000
      - SECRET_KEY=your-secret-key-here
    volumes:
      - ./backend:/app
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8080/api
      - NODE_ENV=production
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/static.headers:/etc/nginx/security.d/headers.conf
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
  frontend_build:
  frontend_node_modules:
  frontend_public:
